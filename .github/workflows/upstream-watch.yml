name: Public upstream discovery (read only)

# Schedule runs on default branch ONLY after this workflow is reviewed and merged.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  source-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Monitor GitHub public repositories, branches, PRs, releases and candidate forks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.upstream_watch --run --limit 30
      - name: Upload public-metadata-only snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azs-upstream-snapshot
          path: artifacts/upstream-watch.json
          retention-days: 14
          if-no-files-found: ignore
