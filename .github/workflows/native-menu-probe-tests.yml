name: Native original Options static audit
on:
  pull_request:
    paths:
      - 'tools/native_menu_probe.py'
      - 'tests/test_native_menu_probe.py'
      - 'tests/test_native_options_xrefs.py'
      - 'tests/test_windows_0138_options.py'
      - 'tests/test_native_options_dispatch.py'
      - 'tests/test_native_options_state_model.py'
      - 'tests/test_native_options_descriptors.py'
      - 'catalog/options_descriptors_0138.json'
      - 'catalog/options_state_model_0138.json'
      - 'catalog/windbg_page_trace_0138.txt'
      - 'catalog/options_selector_0138.json'
      - 'catalog/mpq_spotcheck_0138.json'
      - 'catalog/options_code_graph_0138.json'
      - 'catalog/locale_delta_0137_0138.json'
      - 'catalog/options_code_graph_0136_0137.json'
      - '.github/workflows/native-menu-probe-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test PE32+ parsing and safe read-only guards with synthetic binaries
        run: python -m unittest discover -s tests -p 'test_native*.py' -v
      - name: Validate reviewed 0.138 profile and metadata
        run: python -m unittest discover -s tests -p 'test_windows_0138_options.py' -v
